name: ChristmasFeatures
version: 1.1.0
main: cz.vanocni.features.ChristmasFeaturesPlugin
api-version: '1.21'
author: Server Team
description: Christmas events, ChatGames, winter ambience and native cosmetics for Paper 1.21.10.
softdepend: [ModelEngine, MythicMobs, BetterHud, PlaceholderAPI, christmas-season, ChristmasGift, TrailStudio]
commands:
  christmas:
    description: Main command for ChristmasFeatures.
    usage: /christmas help
    aliases: [vanocni, xfeatures]
permissions:
  christmas.admin:
    description: Allows managing Christmas events and winter settings.
    default: op
  christmas.cosmetics.vip:
    description: Unlocks the ultimate Christmas cosmetic effects.
    default: false
