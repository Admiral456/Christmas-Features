name: ChristmasFeatures
version: 1.0.0
main: cz.vanocni.features.ChristmasFeaturesPlugin
api-version: '1.21'
author: Server Team
description: Christmas events, key chest and ChatGames for Paper 1.21.10.
softdepend: [christmas-season, ChristmasGift]
commands:
  christmas:
    description: Main command for ChristmasFeatures.
    usage: /christmas help
    aliases: [vanocni, xfeatures]
permissions:
  christmas.admin:
    description: Allows managing Christmas events, key chest and winter settings.
    default: op
