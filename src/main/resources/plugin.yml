name: ChristmasFeatures
version: 1.0.9
main: cz.vanocni.features.ChristmasFeaturesPlugin
api-version: '1.21'
author: Server Team
description: Christmas events, key chest, ChatGames, BetterHud HUD and TrailStudio cosmetics for Paper 1.21.10.
softdepend: [ModelEngine, MythicMobs, BetterHud, christmas-season, ChristmasGift, TrailStudio, SupremeTags, BattlePass]
commands:
  christmas:
    description: Main command for ChristmasFeatures.
    usage: /christmas help
    aliases: [vanocni, xfeatures]
permissions:
  christmas.admin:
    description: Allows managing Christmas events, key chest and winter settings.
    default: op
