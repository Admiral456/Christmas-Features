name: ChristmasFeatures
version: 1.0.3
main: cz.vanocni.features.ChristmasFeaturesPlugin
api-version: '1.21'
author: Server Team
description: Christmas events, ChatGames, native cosmetics and The Illusioner boss for Paper 1.21.10.
softdepend: [ModelEngine, MythicMobs, BetterHud, christmas-season, ChristmasGift, TrailStudio]
commands:
  christmas:
    description: Main command for ChristmasFeatures.
    usage: /christmas help
    aliases: [vanocni, xfeatures]
permissions:
  christmas.admin:
    description: Allows managing Christmas events and winter settings.
    default: op
