# ChristmasFeatures - Paper/Purpur 1.21.10
# All worlds listed here are converted progressively as their chunks load.

winter:
  enabled: true
  worlds:
    - world
  biome: SNOWY_PLAINS
  force-snow-weather: true
  chunks-per-tick: 1

# The event centre defaults to the configured world's world spawn.
# You can set center.x/y/z in each event to override it.
events:
  auto-start:
    enabled: true
    interval-minutes: 90
  gifts:
    world: world
    duration-seconds: 300
    spawn-count: 18
    radius: 32
    target-score: 5
  ornaments:
    world: world
    duration-seconds: 300
    spawn-count: 18
    radius: 32
    target-score: 5

# ChatGames run automatically and can also be started with /christmas chatgame start.
chatgames:
  auto-start:
    enabled: true
    interval-minutes: 20
  duration-seconds: 60
  tasks:
    - question: "Kolik je 12 × 8? Napiš výsledek do chatu."
      answer: "96"
      aliases: ["96"]
    - question: "Napiš do chatu heslo SANTACLAUS."
      answer: "SANTACLAUS"
      aliases: ["santaclaus"]
    - question: "Kolik stran má klasická kostka?"
      answer: "6"
      aliases: ["šest", "sest"]
    - question: "Napiš název zimního bloku: SNOW BLOCK."
      answer: "snow block"
      aliases: ["snow_block", "snowblock"]

# BetterHud displays the event panel in the player's right-side HUD.
hud:
  mode: BETTERHUD
  fallback-mode: BOSSBAR

# The Grinch NPC opens this menu when a player right-clicks it.
# Set these to the actual console commands of the tag and quest plugins on this server.
# Use %player% as the placeholder for the player who clicked the Grinch.
grinch:
  menu:
    # The Grinch opens our own cosmetic tag selector for the player who clicked him.
    tags-command: "christmas cosmetics %player% tag"
    quests-command: ""

# The Illusioner is a native Minecraft Illusioner; no client mod is required.
# Set the arena location with /christmas boss illusioner set while standing at the entrance.
bosses:
  illusioner:
    trigger-on-entry: true
    trigger-radius: 9.0
    entry-cooldown-seconds: 300
    spawn:
      world: ""
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
      pitch: 0.0

# These are console commands executed by the server. Replace the examples with the actual
# command syntax of the tags/cosmetics plugin installed on your server.
cosmetics:
  events:
    gifts:
      trailstudio-effect: trail-aurora-braid
      first-place-commands:
        - "give %player% diamond 3"
      # Example integration command: "YOUR_TAG_PLUGIN_COMMAND %player% christmas_winner"
    ornaments:
      trailstudio-effect: burst-frost-flower
      first-place-commands:
        - "give %player% emerald 5"
  chatgames:
    trailstudio-effect: wings-ice-dragon
    winner-commands:
      - "give %player% emerald 3"
