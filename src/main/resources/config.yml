# ChristmasFeatures - Paper/Purpur 1.21.10
# All worlds listed here are converted progressively as their chunks load.

winter:
  enabled: true
  worlds:
    - world
  biome: SNOWY_PLAINS
  force-snow-weather: true
  chunks-per-tick: 1

# The event centre defaults to the configured world's world spawn.
# You can set center.x/y/z in each event to override it.
events:
  auto-start:
    enabled: true
    interval-minutes: 90
  gifts:
    world: world
    duration-seconds: 300
    spawn-count: 18
    radius: 32
    target-score: 5
  ornaments:
    world: world
    duration-seconds: 300
    spawn-count: 18
    radius: 32
    target-score: 5

# ChatGames run automatically and can also be started with /christmas chatgame start.
chatgames:
  auto-start:
    enabled: true
    interval-minutes: 20
  duration-seconds: 60
  tasks:
    - question: "Kolik je 12 × 8? Napiš výsledek do chatu."
      answer: "96"
      aliases: ["96"]
    - question: "Napiš do chatu heslo SANTACLAUS."
      answer: "SANTACLAUS"
      aliases: ["santaclaus"]
    - question: "Kolik stran má klasická kostka?"
      answer: "6"
      aliases: ["šest", "sest"]
    - question: "Napiš název zimního bloku: SNOW BLOCK."
      answer: "snow block"
      aliases: ["snow_block", "snowblock"]

# SIDEBAR shows the event in the right-hand side of the screen.
# Set BOSSBAR if another plugin already owns the sidebar scoreboard.
hud:
  mode: SIDEBAR

chest:
  enabled: true
  # Set the block in-game with /christmas chest set while looking at a chest or barrel.
  location:
    world: ""
    x: 0
    y: 0
    z: 0
  rewards:
    - weight: 45
      name: "§6Vánoční balíček"
      material: GOLD_INGOT
      amount: 12
      lore:
        - "§7Odměna z vánoční bedny"
    - weight: 30
      name: "§bLedový krystal"
      material: AMETHYST_SHARD
      amount: 8
      lore:
        - "§7Odměna z vánoční bedny"
    - weight: 15
      name: "§aSněhová odměna"
      material: DIAMOND
      amount: 2
      lore:
        - "§7Odměna z vánoční bedny"
    # Optional TrailStudio cosmetic reward. The effect ID must exist and be enabled in TrailStudio's effects.yml.
    - weight: 3
      name: "§dVánoční hvězdná aura"
      material: NONE
      lore:
        - "§7Trvalé odemknutí kosmetiky v TrailStudio."
      trailstudio-effect: aura-astral-star
      commands: []
      # Optional extra console commands for another cosmetics plugin may be added here.

# These are console commands executed by the server. Replace the examples with the actual
# command syntax of the tags/cosmetics plugin installed on your server.
cosmetics:
  events:
    gifts:
      trailstudio-effect: trail-aurora-braid
      first-place-commands:
        - "christmas key give %player% 1"
        - "give %player% diamond 3"
      # Example integration command: "YOUR_TAG_PLUGIN_COMMAND %player% christmas_winner"
    ornaments:
      trailstudio-effect: burst-frost-flower
      first-place-commands:
        - "christmas key give %player% 1"
        - "give %player% emerald 5"
  chatgames:
    trailstudio-effect: wings-ice-dragon
    winner-commands:
      - "christmas key give %player% 1"
      - "give %player% emerald 3"
