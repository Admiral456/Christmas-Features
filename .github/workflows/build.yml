name: Build ChristmasFeatures

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate resource pack
        run: python scripts/resourcepack_guard.py validate resourcepack

      - name: Test resource pack guard
        run: python -m unittest discover -s scripts/tests -v

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Package standalone resource pack
        run: python scripts/resourcepack_guard.py zip resourcepack target/ChristmasFeatures-ResourcePack-1.21.10.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChristmasFeatures-${{ github.sha }}
          path: |
            target/*.jar
            target/*ResourcePack*.zip
            target/*ResourcePack*.zip.sha256
          if-no-files-found: error
          retention-days: 14
