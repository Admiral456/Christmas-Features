name: Build ChristmasFeatures

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Expand initial source archive
        shell: bash
        run: |
          if [ -d source-payload ]; then
            cat source-payload/part*.b64 | base64 --decode | tar -xJf - --strip-components=1
            rm -rf source-payload
            git add -A
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Add ChristmasFeatures source project"
              git push
            fi
          fi

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Package resource pack
        run: |
          mkdir -p target
          cd resourcepack
          zip -r ../target/ChristmasFeatures-ResourcePack-1.21.10.zip .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChristmasFeatures-${{ github.sha }}
          path: |
            target/*.jar
            target/*ResourcePack*.zip
          if-no-files-found: error
          retention-days: 14
