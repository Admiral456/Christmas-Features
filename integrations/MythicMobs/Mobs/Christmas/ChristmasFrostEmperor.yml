# Spawn with: /mm m spawn ChristmasFrostEmperor
ChristmasFrostEmperor:
  Type: STRAY
  Display: '&b&lFrost Emperor'
  Health: 320
  Damage: 11
  Faction: ChristmasMountain
  BossBar:
    Enabled: true
    Title: '&b&lFrost Emperor'
    Range: 40
    Color: BLUE
    Style: SEGMENTED_12
  Options:
    Despawn: true
    Silent: true
    PreventOtherDrops: true
    PreventItemPickup: true
    PreventRandomEquipment: true
    KnockbackResistance: 0.9
    MovementSpeed: 0.24
    FollowRange: 36
    MaxCombatDistance: 36
  Model:
    Id: frost_emperor
    ViewRadius: 72
    DamageTint: true
  Skills:
    - state{mid=frost_emperor;s=idle;li=0} @self ~onSpawn
    - headconfig{p=head;em=false;yaw=75;pitch=30;speed=8} @self ~onSpawn
    - headtarget{p=head;em=false;y=1.65;follow=true} @NearestPlayer{r=32} ~onTimer:10
    - state{mid=frost_emperor;s=raise_staff;li=0} @self ~onAttack
    - effect:particles{p=snowflake;amount=22;hS=0.8;vS=0.8;speed=0.04} @self ~onDamaged
    - potion{type=SLOW;duration=50;level=1} @trigger ~onAttack
